# CI / Publish workflow for ConnectWiseAutomateAgent
#
# Uses Sampler/ModuleBuilder/InvokeBuild pipeline with GitVersion for automatic
# semantic versioning.
#
# Branch strategy:
#   develop push  → build → smoke-test → publish prerelease → GitHub Release
#   main push     → build → smoke-test → publish stable → GitHub Release
#   fix/chore/docs/feature pushes, pull requests, manual runs
#                 → build → smoke-test (no publish, no release)
#
# Testing strategy:
#   Full validation (build + PSScriptAnalyzer + Pester) runs LOCALLY before every
#   commit via ./Tests/test-local.ps1. CI provides a safety-net smoke test only.
#   See AGENTS.md for the mandatory local validation workflow.
#
# Versioning:
#   GitVersion calculates the version from git history and branch.
#   develop → prerelease (e.g., 1.0.0-alpha0001)
#   main    → stable (e.g., 1.0.0)
#   Sampler reads GitVersion output automatically during Build_ModuleOutput_ModuleBuilder.
#
# Required secrets:
#   PSGALLERY_API_KEY — NuGet API key for the PowerShell Gallery (PSGallery environment)
#
# Permissions:
#   Read-only by default. contents: write only on the release jobs (git tag + GitHub Release).
#
# Security note: never interpolate ${{ github.* }} / ${{ needs.* }} / ${{ steps.* }}
# values directly into a run: script. Pass them through env: instead.
#
# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) keeps them current.

name: CI / Publish

on:
  push:
    branches:
      - main
      - develop
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'feature/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  MODULE_NAME: ConnectWiseAutomateAgent

jobs:
  build:
    name: Build Module
    runs-on: windows-latest
    outputs:
      module_version: ${{ steps.version.outputs.version }}
      full_version: ${{ steps.version.outputs.full_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # TODO: gittools/actions v4 requires GitVersion 6 (GitVersion.yml and output
      # variable changes); v1 is the last line that supports GitVersion 5.x.
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@dcb17efb49ec7f20efdebce79cc397a3952c63db # v1.2.0
        with:
          versionSpec: '5.x'

      - name: Resolve dependencies
        shell: pwsh
        run: ./build.ps1 -ResolveDependency -Tasks noop

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Tasks build

      - name: Read version from built manifest
        id: version
        shell: pwsh
        run: |
          $modulePath = Get-ChildItem -Path "output/$env:MODULE_NAME" -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $manifest = Import-PowerShellDataFile (Join-Path $modulePath.FullName "$env:MODULE_NAME.psd1")
          $version = $manifest.ModuleVersion
          $prerelease = $manifest.PrivateData.PSData.Prerelease
          $fullVersion = if ($prerelease) { "$version-$prerelease" } else { $version }
          $isPrerelease = if ($prerelease) { 'true' } else { 'false' }
          Write-Host "Version: $fullVersion (prerelease: $isPrerelease)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "full_version=$fullVersion" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Upload built module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-build
          path: output/${{ env.MODULE_NAME }}
          retention-days: 7

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: output/ReleaseNotes.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload required modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-modules
          path: output/RequiredModules
          retention-days: 1

  smoke-test:
    name: Smoke Test
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-build
          path: output/${{ env.MODULE_NAME }}

      - name: Download required modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: required-modules
          path: output/RequiredModules

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Resolve-Path output/RequiredModules)" + [IO.Path]::PathSeparator + $env:PSModulePath
          Import-Module PSScriptAnalyzer
          # Analyze .ps1/.psm1 only; .psd1 excluded due to PSScriptAnalyzer NullRef bug
          $files = Get-ChildItem -Path source -Include '*.ps1','*.psm1' -Recurse -File
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings .PSScriptAnalyzerSettings.psd1 }
          if ($results) {
              $results | Format-Table -AutoSize
              throw "PSScriptAnalyzer found $($results.Count) issue(s)"
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $env:PSModulePath = "$(Resolve-Path output/RequiredModules)" + [IO.Path]::PathSeparator + $env:PSModulePath
          ./build.ps1 -Tasks test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: output/testResults/
          retention-days: 7
          if-no-files-found: ignore

  # ─── Publish jobs ───────────────────────────────────────────────────────

  publish-prerelease:
    name: Publish Prerelease
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [build, smoke-test]
    runs-on: windows-latest
    environment: PSGallery
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download built module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-build
          path: output/${{ env.MODULE_NAME }}

      - name: Verify prerelease tag is set
        shell: pwsh
        run: |
          $modulePath = Get-ChildItem -Path "output/$env:MODULE_NAME" -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $manifest = Import-PowerShellDataFile (Join-Path $modulePath.FullName "$env:MODULE_NAME.psd1")
          $prerelease = $manifest.PrivateData.PSData.Prerelease
          if (-not $prerelease) {
            Write-Error "Prerelease tag is not set in the built manifest. GitVersion should produce a prerelease on develop."
            exit 1
          }
          Write-Host "Prerelease tag: $prerelease"

      - name: Publish to PSGallery (prerelease)
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          FULL_VERSION: ${{ needs.build.outputs.full_version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is not set for this environment.' }
          $modulePath = Get-ChildItem -Path "output/$env:MODULE_NAME" -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1

          # A duplicate on the first attempt means two commits built the same version: fail loudly.
          $existing = Find-PSResource -Name $env:MODULE_NAME -Version $env:FULL_VERSION -Prerelease `
            -Repository PSGallery -ErrorAction SilentlyContinue
          if ($existing) {
            if ([int]$env:RUN_ATTEMPT -gt 1) {
              Write-Host "Version $env:FULL_VERSION already on PSGallery (re-run attempt $env:RUN_ATTEMPT). Skipping publish."
              exit 0
            }
            throw "Version $env:FULL_VERSION of $env:MODULE_NAME is already published to PSGallery."
          }

          Publish-PSResource -Path $modulePath.FullName -ApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -ErrorAction Stop
          Write-Host "Published $env:MODULE_NAME $env:FULL_VERSION"

  publish-stable:
    name: Publish Stable
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, smoke-test]
    runs-on: windows-latest
    environment: PSGallery
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download built module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-build
          path: output/${{ env.MODULE_NAME }}

      - name: Verify no prerelease tag
        shell: pwsh
        run: |
          $modulePath = Get-ChildItem -Path "output/$env:MODULE_NAME" -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $manifest = Import-PowerShellDataFile (Join-Path $modulePath.FullName "$env:MODULE_NAME.psd1")
          $prerelease = $manifest.PrivateData.PSData.Prerelease
          if ($prerelease) {
            Write-Error "Prerelease tag '$prerelease' is still set in the built manifest. Expected GitVersion to produce a stable version on main."
            exit 1
          }
          Write-Host "Version: $($manifest.ModuleVersion) (stable)"

      - name: Publish to PSGallery (stable)
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          FULL_VERSION: ${{ needs.build.outputs.full_version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is not set for this environment.' }
          $modulePath = Get-ChildItem -Path "output/$env:MODULE_NAME" -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1

          # A duplicate on the first attempt means two commits built the same version: fail loudly.
          $existing = Find-PSResource -Name $env:MODULE_NAME -Version $env:FULL_VERSION `
            -Repository PSGallery -ErrorAction SilentlyContinue
          if ($existing) {
            if ([int]$env:RUN_ATTEMPT -gt 1) {
              Write-Host "Version $env:FULL_VERSION already on PSGallery (re-run attempt $env:RUN_ATTEMPT). Skipping publish."
              exit 0
            }
            throw "Version $env:FULL_VERSION of $env:MODULE_NAME is already published to PSGallery."
          }

          Publish-PSResource -Path $modulePath.FullName -ApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -ErrorAction Stop
          Write-Host "Published $env:MODULE_NAME $env:FULL_VERSION"

  # ─── GitHub Release jobs ────────────────────────────────────────────────

  release-prerelease:
    name: GitHub Release (Prerelease)
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' && !failure() && !cancelled()
    needs: [publish-prerelease, build]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FULL_VERSION: ${{ needs.build.outputs.full_version }}
      TAG: v${{ needs.build.outputs.full_version }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      # Credentials are kept: this job pushes the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Check if release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:TAG 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists. Skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release $env:TAG not found. Will create."
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Download release notes
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .
        continue-on-error: true

      - name: Prepare release notes
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (Test-Path 'ReleaseNotes.md') {
            $content = (Get-Content 'ReleaseNotes.md' -Raw).Trim()
            if ($content) {
              $content | Out-File release-notes.md -Encoding UTF8
              return
            }
          }
          "Prerelease $env:FULL_VERSION" | Out-File release-notes.md -Encoding UTF8

      - name: Download built module
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-build
          path: artifact

      - name: Create git tag
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          git tag $env:TAG $env:COMMIT_SHA
          git push origin $env:TAG

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $psm1 = Get-ChildItem -Path "artifact/*/$env:MODULE_NAME.psm1" | Select-Object -First 1
          gh release create $env:TAG `
            $psm1.FullName `
            --title "$env:MODULE_NAME $env:FULL_VERSION" `
            --notes-file release-notes.md `
            --prerelease `
            --verify-tag

  release-stable:
    name: GitHub Release (Stable)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !failure() && !cancelled()
    needs: [publish-stable, build]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FULL_VERSION: ${{ needs.build.outputs.full_version }}
      TAG: v${{ needs.build.outputs.full_version }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      # Credentials are kept: this job pushes the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Check if release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:TAG 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists. Skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release $env:TAG not found. Will create."
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Download release notes
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .
        continue-on-error: true

      - name: Prepare release notes
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (Test-Path 'ReleaseNotes.md') {
            $content = (Get-Content 'ReleaseNotes.md' -Raw).Trim()
            if ($content) {
              $content | Out-File release-notes.md -Encoding UTF8
              return
            }
          }
          $version = $env:FULL_VERSION
          $lines = Get-Content CHANGELOG.md
          $pattern = "^## \[$([regex]::Escape($version))\]"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $pattern) { $start = $i; break }
          }
          if ($start -eq -1) {
              "Release $version" | Out-File release-notes.md -Encoding UTF8
          } else {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                  if ($lines[$i] -match '^## \[') { $end = $i; break }
              }
              ($lines[($start+1)..($end-1)] -join "`n").Trim() | Out-File release-notes.md -Encoding UTF8
          }

      - name: Download built module
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-build
          path: artifact

      - name: Create git tag
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          git tag $env:TAG $env:COMMIT_SHA
          git push origin $env:TAG

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $psm1 = Get-ChildItem -Path "artifact/*/$env:MODULE_NAME.psm1" | Select-Object -First 1
          gh release create $env:TAG `
            $psm1.FullName `
            --title "$env:MODULE_NAME $env:FULL_VERSION" `
            --notes-file release-notes.md `
            --verify-tag
